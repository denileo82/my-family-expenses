apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: myfamily-expenses
  namespace: myfamily-expenses
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt
    nginx.ingress.kubernetes.io/proxy-body-size: "50m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "300"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "300"
spec:
  ingressClassName: nginx
  tls:
  - hosts:
    - my-family-expenses.flextopus.com.br
    secretName: myfamily-expenses-tls
  rules:
  - host: my-family-expenses.flextopus.com.br
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: myfamily-expenses
            port:
              number: 80
